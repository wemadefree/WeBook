{% load i18n %}

{% if services_providable %}
<div class="table-responsive">
    <table class="table table-sm">
        <thead>
            <tr>
                <th>{% trans "Service" %}</th>
                <th>{% trans "Options" %}</th>
            </tr>
        </thead>

        <tbody>
            {% for service in services_providable.all %}
                <tr>
                    <td><a href="{% url 'arrangement:servicetype_detail' slug=service.service_type.slug %}">{{ service.service_type.name }}</a></td>
                    <td>
                        <button class="btn btn-sm btn-danger">{% trans "Remove from services" %}</button>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% else %}
<div class="table-empty-state" role="status">
    <i class="fas fa-hand-holding-dollar" aria-hidden="true"></i>
    <div>
        <h3 class="h6 mb-1">{% trans "No services" %}</h3>
        <p class="mb-0 text-muted">{% trans "This organization has no registered services yet." %}</p>
    </div>
</div>
{% endif %}
