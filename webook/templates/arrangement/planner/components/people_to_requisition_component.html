
{% load i18n %}

<h3>{% trans "People to requisition" %}</h3>
<div class="alert alert-light p-0">
    <em class="small">
        {% trans "Click 'Send request' to send a request to this person." %}
    </em>
</div>
<table class="table table-sm">
    <thead>
        <tr>
            <th class="fw-bold">{% trans "Person" %}</th>
            <th class="fw-bold">{% trans "Options" %}</th>
        </tr>
    </thead>

    <tbody>
        {% for person in object_list %}
            <tr>
                <td>{{ person }}</td>
                <td>
                    <button class="initiatePersonRequisitionBtn btn btn-wemade" value="{{ person.pk }}" type="button">{% trans "Send request" %}</button>
                </td>
            </tr>
        {% endfor %}
    </tbody>
</table>
