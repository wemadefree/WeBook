<template id="vuec-order-completes-table">
    <table-component :data-source="dataSourceFunc"
                     :can-search="true">
    </table-component>
</template>

<script>
    let OrderCompletesTable = {
        components: {
            'table-component': TableComponent,
        },
        props: {
            serviceId: Number,
        },
        emits: [],
        data() {
            return {}
        },
        methods: {
            async dataSourceFunc() {
                let data = await fetch("/api/arrangement/service_order/list?service_id=" + this.serviceId + "&state=provisioned")
                    .then(response => response.json());

                console.log("order completes data", data);

                return {
                    columns: {
                        "id": { 
                            isHtml: false, 
                            friendlyName: "#", 
                            isSortable: true,
                            isSearchable: true
                        },
                        "created": { 
                            isHtml: false, 
                            friendlyName: "Tidsstempel",
                            isSortable: true,
                            formatter: (item) => {
                                return new Date(item.created).toLocaleString();
                            }
                        },
                        "completion": {
                            isHtml: true,
                            friendlyName: "Tildelte",
                            isSortable: false,
                            isSearchable: false,
                            formatter: (item) => {
                                return `<span class='badge badge-danger'>10/20</span>`;
                            }
                        },
                        "freetext_comment": { 
                            isHtml: false, 
                            friendlyName: "Kommentar fra planlegger", 
                            isSortable: true,
                            isSearchable: true,
                        }
                    },
                    actions: {
                        // "showDetailedView": { type: 'main', content: '<i class="fas fa-eye"></i>&nbsp; Vis mer', isContentHtml: true },
                    },
                    data: data.data
                };
            }
        },
        template: '#vuec-order-completes-table',
        delimiters: [ '[[', ']]'],
    }
</script>
