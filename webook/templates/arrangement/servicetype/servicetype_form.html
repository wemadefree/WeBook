{% extends "common/form_view.html" %}
{% load crispy_forms_tags %}
{% load static i18n %}

{% block form_fields %}
    {{ form | crispy }}
{% endblock %}

{% block form_actions %}
    <a class="btn wb-btn-secondary" href="{{ RETURN_URL }}">
        <i class="fas fa-times"></i>&nbsp; {% trans "Cancel" %}
    </a>
    {% if not form.instance.id %}
        <button type="submit" class="btn wb-btn-secondary" value="submitAndNew" name="submitAndNew">
            {% trans "Save, and new" %}
        </button>
    {% endif %}
    <button type="submit" class="btn wb-btn-main" value="submit" name="submit">
        <i class="fas fa-check"></i>&nbsp; {% trans "Save" %}
    </button>
{% endblock %}
