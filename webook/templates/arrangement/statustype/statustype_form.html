{% load static i18n %}
{% load crispy_forms_tags %}


{% block content %}
    <form action="" method="post">
        {% csrf_token %}

        <div>
            <label for="{{ form.name.id_for_label }}">{{ form.name.label }}</label>
            <input type="text" name="{{ form.name.name }}" class="form-control" id="{{ form.name.id_for_label }}" value="{{ form.name.value|default:'' }}">
        </div>

        <div class="mt-3 form-group">
            <label for="">{{form.color.label}}</label>
            <input type="color" name="{{form.color.name}}" id="" value="{{ form.color.value }}">
        </div>

        <div class="d-flex flex-wrap justify-content-end gap-2 mt-4 pt-3 border-top">
            <button class="btn wb-btn-secondary cancel-button" onClick="window.history.back(); return false;">
                <i class="fas fa-times"></i>&nbsp; {% trans "Cancel" %}
            </button>
            <button class="btn wb-btn-main" type="submit">
                <i class="fas fa-check"></i>&nbsp; {% trans "Save" %}
            </button>
        </div>
    </form>
{% endblock %}
