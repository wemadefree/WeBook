{% load static i18n %}

{% block content %}
    <form method="post">
        {% csrf_token %}

        <h4>Er du sikker?</h4>

        {% if ENTITY_NAME %}
            <p>
                Er du sikker på at du vil slette <i>'{{ ENTITY_NAME }}'</i> ?<br>
            </p>
        {% else %}
            <p>Denne handlingen kan ikke angres.</p>

        {% endif %}

        <a class="btn wb-btn-secondary cancel-button" href="{{ RETURN_URL }}"><i class="fas fa-times"></i>&nbsp; Avbryt</a>
        <button class="btn wb-btn-main float-end" type="submit"><i class="fas fa-trash"></i>&nbsp; Slett</button>
    </form>
{% endblock %}
